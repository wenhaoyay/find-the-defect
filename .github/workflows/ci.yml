name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Luau under Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Rojo build, format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          mkdir -p "$HOME/bin"
          fetch() { curl -fsSL "$1" -o /tmp/tool.zip && unzip -o -q /tmp/tool.zip -d "$HOME/bin"; }
          fetch https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          fetch https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          fetch https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build the place
        run: rojo build default.project.json -o find-the-defect.rbxl
      - name: Check formatting
        # Advisory until the first run: StyLua has not yet been run on this code.
        continue-on-error: true
        run: stylua --check src tests tools
      - name: Lint
        # Advisory until the first run: Selene has not yet been run on this code.
        continue-on-error: true
        run: selene src
